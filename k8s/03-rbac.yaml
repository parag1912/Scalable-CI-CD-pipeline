apiVersion: v1
kind: ServiceAccount
metadata:
  name: api-server-sa
  namespace: app-deployer
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: job-launcher
  namespace: app-deployer
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: api-server-job-launcher
  namespace: app-deployer
subjects:
  - kind: ServiceAccount
    name: api-server-sa
    namespace: app-deployer
roleRef:
  kind: Role
  name: job-launcher
  apiGroup: rbac.authorization.k8s.io
